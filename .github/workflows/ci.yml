name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Installs the JDK and both Maven lines pinned in mise.toml, and caches them.
      - uses: jdx/mise-action@v2
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: m2-
      - name: Unit tests, ITs on Maven 3.9, ITs on Maven 4
        run: mise run ci
      - name: Upload IT logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: it-logs
          path: |
            mojo-io-it/target/it/**/build-*.log
            mojo-io-it/target/failsafe-reports/
