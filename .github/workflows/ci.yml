name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Releases are versioned from commit messages, and rebase merges put every commit of a PR on main:
  # each one must follow Conventional Commits (https://www.conventionalcommits.org).
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Conventional Commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'
          bad=0
          while IFS= read -r line; do
            sha=${line%% *}; subject=${line#* }
            if ! printf '%s' "$subject" | grep -Eq "$pattern"; then
              echo "::error::${sha} is not a Conventional Commit: ${subject}"
              bad=1
            fi
          done < <(git log --no-merges --format='%h %s' "$BASE..$HEAD")
          [ "$bad" = 0 ] || { echo "Use <type>(<scope>)!: <summary>, e.g. 'fix(cache): never restore a damaged blob'"; exit 1; }

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Installs the JDK and both Maven lines pinned in mise.toml, and caches them.
      - uses: jdx/mise-action@v2
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: m2-
      - name: Unit tests, ITs on Maven 3.9, ITs on Maven 4
        run: mise run ci
      - name: Upload IT logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: it-logs
          path: |
            mojo-io-it/target/it/**/build-*.log
            mojo-io-it/target/failsafe-reports/
